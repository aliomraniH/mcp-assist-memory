[project]
name = "mcp-assist-memory"
version = "0.1.0"
description = "Generic, project-agnostic shared memory / coordination / artifact MCP server over Streamable HTTP (Postgres + pgvector). Tier 1 — no domain terms."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # PINNED: fastmcp 3.4.3 added HostOriginGuardMiddleware which rejects any
    # request whose Host is not in DEFAULT_HOSTS with a bare 421 "Misdirected
    # Request" (and any browser Origin not allowed with 403 "Forbidden Origin").
    # We now RUN that guard for defense-in-depth, configured with the deployment
    # domain(s) in allowed_hosts and the claude.ai connector in allowed_origins
    # (see app.py / config.mcp_allowed_hosts). Pin fastmcp+mcp to verified-good
    # versions so the deploy build matches dev and the guard behavior is stable;
    # an unpinned build would drift and could change the guard's defaults.
    "fastmcp==3.4.3",
    "mcp==1.28.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "httpx>=0.27",          # VoyageEmbedder (Phase 3) calls the embeddings REST API
    # Memory Curator (write-side consolidation). Optional at runtime — the server
    # runs a DisabledCurator with no key — but the SDK must be installed so that,
    # when a key IS configured, curate() doesn't fail closed with sdk_unavailable.
    "anthropic>=0.116.0",
    # Idempotency fingerprint (v3 item 4): RFC 8785 / JCS canonicalization.
    # Python's json.dumps is NOT JCS-compliant (ECMA-262 shortest-round-trip
    # numbers, UTF-16 code-unit key sort) — never hand-roll this.
    "rfc8785>=0.1.4",
    # --- Intent Gate remediation (Phases 1-3) ---
    # Deterministic intent-feature extraction on the Tier-1 hot path: ROOT-verb
    # lemma, dobj lemma, negation scope. Escalation must be decidable without an
    # LLM, so the extractor is a dependency, not a service call.
    "spacy>=3.8,<3.9",
    # The en_core_web_sm model is NOT published to PyPI. PEP 508 direct
    # reference pins the exact wheel so the deploy build cannot resolve a
    # different model revision than dev verified. Keep in lockstep with the
    # en-core-web-sm pin in constraints.txt.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # JSON-Logic evaluation for skill trigger predicates. This is the MAINTAINED
    # fork; nadirizr/json-logic-py is discontinued and must not be substituted.
    "panzi-json-logic>=1.0.1,<2",
    # ONE dedicated DIRECT (non-pooler) Neon connection for LISTEN
    # gate_invalidate. Neon's pooled endpoint supports NOTIFY but not LISTEN
    # (PgBouncer transaction mode drops session-level features), so the cache
    # listener cannot ride on the app's pooled psycopg pool.
    "asyncpg>=0.30,<0.32",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# FIXTURE ENVIRONMENT DISCIPLINE.
#
# The Intent Gate v1 validation run found two fixtures that were green in CI and
# false in production — not because the logic was wrong, but because the fixture
# was under-specified for the environment it was claimed against. G0-7 asserted a
# <50ms latency budget that only a local Postgres (few-ms round trips) can meet;
# a Reserved VM talking to Neon has a ~59ms floor. G1-5 asserted a clean
# similarity floor against a 5-entry namespace, so the floor was never exercised;
# a 45-entry namespace admitted noise at cosine 0.25-0.39.
#
# A fixture asserted green in the wrong environment is NOT green. Every fixture
# therefore declares exactly ONE environment class, and a run in the wrong class
# must SKIP rather than pass:
#
#   ci         meaningful against local Postgres in this harness. Runs by
#              default. The only class this branch may claim green.
#   neon       meaningful only against a real Neon topology — direct AND pooled
#              endpoints, real round-trip latency, PgBouncer transaction mode.
#              Deselected by default; opt in with `-m neon` and a Neon
#              DATABASE_URL. Never claimed green from a local run.
#   postdeploy meaningful only against the deployed production server. Shipped
#              as executable probes in the deploy baton and run by the operator.
#              Deselected by default; opt in with `-m postdeploy`.
#
# Unmarked legacy tests keep running by default — the deselect is expressed as
# "not neon and not postdeploy" rather than "ci" precisely so that adding this
# taxonomy cannot silently drop the existing 370.
markers = [
    "ci: meaningful against local Postgres in this harness (default; claimable by CI)",
    "neon: requires a real Neon topology (direct + pooled, real latency); never claimed green locally",
    "postdeploy: requires the deployed production server; run by the operator from the deploy baton",
]
addopts = "-m 'not neon and not postdeploy'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The en_core_web_sm model is pinned as a PEP 508 direct wheel URL (it is not
# on PyPI); hatchling rejects direct references unless this is set.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Top-level service modules (app.py, config.py, admin_store.py, dashboard.py) are
# imported from the repo root (editable install / `uvicorn app:app`); the
# packaged code is the reusable storage + server tiers.
packages = ["server", "storage"]
